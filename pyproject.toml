[project]
name = "qlikview-calendar"
version = "0.1.0"
description = "Qlikview calendar"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "holidays>=0.85",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/qlikview_calendar"
Repository = "https://github.com/simonerigoni/qlikview_calendar"
Medium = "https://medium.com/@simone-rigoni01/quick-and-easy-calendar-with-python-and-qlikview-cdd5d2db30e1"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
